name: Build Tu Vi Lac Hong APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android project structure
        run: |
          mkdir -p app/src/main/java/com/lacviet/tuvi
          mkdir -p app/src/main/assets
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/lacviet/tuvi/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp build.gradle app/build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  maven { url 'https://maven.aliyun.com/repository/central' }
                  mavenCentral()
              }
          }
          rootProject.name = "TuViLacHongAndroid"
          include ':app'
          EOF

      - name: Generate Gradle wrapper
        run: |
          for attempt in 1 2 3 4 5; do
            gradle wrapper --gradle-version 8.7 && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 20
          done

      - name: Build debug APK
        run: ./gradlew --no-daemon --refresh-dependencies assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TuViLacHong-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
